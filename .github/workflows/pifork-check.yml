name: Pifork Check

# Fork-only gate for the release branch. Upstream's ci.yml only runs on pushes to main, PRs to
# main and v* tags, so a push to pifork would otherwise get no check at all.
#
# Same steps as ci.yml's build-check job, minus the preview packages and minus
# check:released-changelogs (it compares against the newest upstream v* tag, which this fork's
# pifork-v* tag line does not have).

on:
  push:
    branches: [pifork]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pifork-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      # `npm run check` runs biome with --write, so a dirty tree means formatting drifted and the
      # job silently fixed it instead of failing. Models and schemas are regenerated by the build;
      # a diff there means a committed artifact was stale.
      - name: Verify the check left the tree clean
        run: git diff --exit-code